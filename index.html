<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NetSentry</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <div id="app">
      <header class="header">
        <h1 id="app-title">NetSentry</h1>
        <button id="settings-btn" class="icon-btn">&#9881;</button>
      </header>

      <main class="main-content">
        <section id="status-section" class="card">
          <h2 id="status-title">Network Status</h2>
          <div class="status-indicator">
            <span id="status-dot" class="dot online"></span>
            <span id="status-text">Online</span>
          </div>
          <div class="status-details">
            <div class="detail-row">
              <span id="adapter-label">Adapter:</span>
              <span id="adapter-status">Normal</span>
            </div>
            <div class="detail-row">
              <span id="ping-label">Ping:</span>
              <span id="ping-status">OK</span>
            </div>
            <div class="detail-row">
              <span id="last-check-label">Last Check:</span>
              <span id="last-check-time">--</span>
            </div>
          </div>
        </section>

        <section id="warning-section" class="card warning hidden">
          <div class="warning-content">
            <span class="warning-icon">&#9888;</span>
            <div class="warning-text">
              <p id="warning-title">Network Disconnected!</p>
              <p id="warning-duration"></p>
            </div>
          </div>
        </section>

        <section id="stats-section" class="card">
          <h2 id="stats-title">Statistics</h2>
          <div class="stats-grid">
            <div class="stat-item">
              <span id="disconnect-count-label" class="stat-label">Disconnect Count</span>
              <span id="disconnect-count" class="stat-value">0</span>
            </div>
            <div class="stat-item">
              <span id="current-duration-label" class="stat-label">Current Duration</span>
              <span id="current-duration" class="stat-value">0s</span>
            </div>
          </div>
        </section>

        <section id="history-section" class="card">
          <h2 id="history-title">Disconnect History</h2>
          <div id="history-list" class="history-list">
            <p id="no-history" class="no-data">No disconnect records</p>
          </div>
        </section>

        <section id="logs-section" class="card hidden">
          <div class="logs-header">
            <h2 id="logs-title">Logs</h2>
            <button id="refresh-logs-btn" class="btn-small">&#8635;</button>
          </div>
          <div id="logs-container" class="logs-container"></div>
        </section>
      </main>

      <div id="settings-modal" class="modal hidden">
        <div class="modal-content">
          <div class="modal-header">
            <h2 id="settings-modal-title">Settings</h2>
            <button id="close-settings-btn" class="close-btn">&times;</button>
          </div>
          <div class="modal-body">
            <div class="form-group">
              <label id="language-label" for="language-select">Language</label>
              <select id="language-select" class="form-control">
                <option value="zh">中文</option>
                <option value="en">English</option>
              </select>
            </div>
            <div class="form-group">
              <label id="port-label" for="port-input">Port</label>
              <input type="number" id="port-input" class="form-control" min="1" max="65535" value="8080">
            </div>
            <div class="form-group checkbox-group">
              <label class="checkbox-label">
                <input type="checkbox" id="autostart-checkbox">
                <span id="autostart-label">Autostart</span>
              </label>
            </div>
          </div>
          <div class="modal-footer">
            <button id="cancel-settings-btn" class="btn btn-secondary">Cancel</button>
            <button id="save-settings-btn" class="btn btn-primary">Save</button>
          </div>
        </div>
      </div>

      <div id="about-modal" class="modal hidden">
        <div class="modal-content">
          <div class="modal-header">
            <h2 id="about-modal-title">About</h2>
            <button id="close-about-btn" class="close-btn">&times;</button>
          </div>
          <div class="modal-body about-content">
            <h3>NetSentry</h3>
            <p id="about-version">Version 0.1.0</p>
            <p id="about-desc">Network monitoring tool with web interface</p>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
